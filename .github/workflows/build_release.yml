name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Publishing a GitHub Release needs write access to the repository contents.
permissions:
  contents: write

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests before build
        run: flutter test

      - name: Build Android Release APK
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # Surface the failure in the run summary, readable without logs.
            # One annotation (GitHub caps them at 10 per step) holding the
            # Gradle "What went wrong" block, or the log tail as a fallback.
            summary=$(sed -n '/What went wrong/,/\* Try:/p' build.log | head -n 40)
            [ -z "$summary" ] && summary=$(tail -n 40 build.log)
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=APK build failed::${summary}"
            exit 1
          fi

      - name: Name the APK after the version
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk "Siz-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: siz-release-apk
          path: Siz-*.apk

      # A release page per tag: the APK downloads straight from a phone.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Siz-*.apk
          generate_release_notes: true
